name: Build
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Check libs
        run: |
          ls -la libs
          test -f libs/hbm-1.0.5.jar || (echo "Missing libs/hbm-1.0.5.jar" && exit 1)
          test -f libs/golemcore-1.0.5.jar || (echo "Missing libs/golemcore-1.0.5.jar" && exit 1)
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cursed-continuum-jar
          path: build/libs/*.jar
