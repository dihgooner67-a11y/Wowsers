name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Get dependency jars from the "libs" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download libs --repo "${{ github.repository }}" --dir libs --pattern '*.jar' --clobber
          ls -la libs
          [ -f libs/hbm-1.0.5.jar ] || cp "$(ls libs/hbm*.jar | head -n1)" libs/hbm-1.0.5.jar
          [ -f libs/golemcore-1.0.5.jar ] || cp "$(ls libs/golemcore*.jar | head -n1)" libs/golemcore-1.0.5.jar
          ls -la libs
      - name: Check libs
        run: |
          test -f libs/hbm-1.0.5.jar || (echo "Missing libs/hbm-1.0.5.jar (attach it to the libs release)" && exit 1)
          test -f libs/golemcore-1.0.5.jar || (echo "Missing libs/golemcore-1.0.5.jar (attach it to the libs release)" && exit 1)
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cursed-continuum-jar
          path: build/libs/*.jar
